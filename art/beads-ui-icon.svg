<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272d40"/>
      <stop offset="1" stop-color="#111420"/>
    </linearGradient>
    <linearGradient id="goal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb8ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- threads: two strands converging on the goal bead -->
  <g fill="none" stroke="#8a93a8" stroke-width="9" stroke-linecap="round">
    <path d="M 72 192 Q 78 118 124 82"/>
    <path d="M 184 192 Q 178 118 132 82"/>
  </g>

  <!-- goal bead -->
  <circle cx="128" cy="76" r="37" fill="url(#goal)"/>
  <circle cx="128" cy="76" r="37" fill="none" stroke="#0c2e1c" stroke-opacity="0.25" stroke-width="3"/>
  <ellipse cx="115" cy="62" rx="12" ry="8" fill="#ffffff" opacity="0.4" transform="rotate(-30 115 62)"/>

  <!-- beads threaded mid-strand -->
  <circle cx="90" cy="134" r="15" fill="url(#amber)"/>
  <ellipse cx="85" cy="128" rx="5" ry="3.4" fill="#ffffff" opacity="0.45" transform="rotate(-30 85 128)"/>
  <circle cx="166" cy="134" r="15" fill="url(#rose)"/>
  <ellipse cx="161" cy="128" rx="5" ry="3.4" fill="#ffffff" opacity="0.45" transform="rotate(-30 161 128)"/>

  <!-- base beads -->
  <circle cx="72" cy="192" r="25" fill="url(#blue)"/>
  <ellipse cx="63" cy="183" rx="8" ry="5.5" fill="#ffffff" opacity="0.4" transform="rotate(-30 63 183)"/>
  <circle cx="184" cy="192" r="25" fill="url(#violet)"/>
  <ellipse cx="175" cy="183" rx="8" ry="5.5" fill="#ffffff" opacity="0.4" transform="rotate(-30 175 183)"/>
</svg>
